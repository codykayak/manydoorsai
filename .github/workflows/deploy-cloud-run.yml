name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for GCP deploy credentials
        id: creds
        run: |
          if [ -z "${{ secrets.PROJECTMANAGEMENT }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Cloud Run deploy blocked::Add PROJECTMANAGEMENT (GCP service-account JSON with Cloud Build, Storage, and Cloud Run permissions)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'

      - id: auth
        if: steps.creds.outputs.present == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PROJECTMANAGEMENT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.creds.outputs.present == 'true'

      - name: Build and deploy (cloudbuild.yaml)
        if: steps.creds.outputs.present == 'true'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || steps.auth.outputs.project_id }}
        run: |
          gcloud builds submit --config cloudbuild.yaml --project "${PROJECT_ID}" --substitutions SHORT_SHA=$(git rev-parse --short HEAD)

      - name: Verify live site updated
        if: steps.creds.outputs.present == 'true'
        run: |
          set -euo pipefail
          SITE="https://www.manydoorsai.com"
          RUN_URL="https://manydoorsai-886711655757.us-west1.run.app"
          ok=0
          for i in 1 2 3 4 5 6; do
            sleep 20
            site_lm="$(curl -fsI "$SITE/" | awk -F': ' 'tolower($1)=="last-modified" {print $2}' | tr -d '\r')"
            run_lm="$(curl -fsI "$RUN_URL/" | awk -F': ' 'tolower($1)=="last-modified" {print $2}' | tr -d '\r')"
            html="$(curl -fsSL "$SITE/")"
            css="$(echo "$html" | grep -oE 'assets/index-[^"]+\.css' | head -1)"
            if [ -n "$css" ]; then
              css_body="$(curl -fsSL "$SITE/$css")"
              if echo "$css_body" | grep -qE 'html,body,#root|html,body'; then
                echo "OK  $SITE CSS includes full-bleed html/body reset"
                ok=1
                break
              fi
            fi
            echo "Attempt $i/6: site Last-Modified=${site_lm:-unknown} run.app Last-Modified=${run_lm:-unknown}"
          done
          if [ "$ok" != 1 ]; then
            echo "::warning title=Custom domain may be stale::Deploy succeeded on Cloud Run but $SITE still lacks the html/body CSS reset. Check domain mapping and run: gcloud run services update-traffic manydoorsai --region us-west1 --to-latest"
            exit 0
          fi
          echo "Deploy verified on custom domain."

      - name: Fail when no GCP credentials
        if: steps.creds.outputs.present != 'true'
        run: exit 1
