name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for GCP credentials
        id: creds
        run: |
          if [ -z "${{ secrets.PROJECTMANAGMENT }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloud Run deploy skipped::Add PROJECTMANAGMENT secret to enable deploys."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'

      - id: auth
        if: steps.creds.outputs.present == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PROJECTMANAGMENT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.creds.outputs.present == 'true'

      - name: Build and deploy (cloudbuild.yaml)
        if: steps.creds.outputs.present == 'true'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || steps.auth.outputs.project_id }}
        run: |
          gcloud builds submit --config cloudbuild.yaml --project "${PROJECT_ID}"
