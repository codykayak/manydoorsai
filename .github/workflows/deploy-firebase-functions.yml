name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'src/content/**'
      - 'scripts/build-pm-knowledge.mjs'
      - '.github/workflows/deploy-firebase-functions.yml'
      - 'firebase.json'
      - 'firestore.rules'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Firebase deploy credentials
        id: creds
        env:
          FIREBASE_MANNYDOORS: ${{ secrets.FIREBASEMANNYDOORS }}
          FIREBASE_TOKEN_LEGACY: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          is_sa_json() {
            printf '%s' "${1:-}" | python3 -c "import json,sys; d=json.load(sys.stdin); exit(0 if d.get('type')=='service_account' else 1)" 2>/dev/null
          }

          if is_sa_json "$FIREBASE_MANNYDOORS"; then
            echo "method=sa" >> "$GITHUB_OUTPUT"
            echo "Firebase auth: service account JSON (FIREBASEMANNYDOORS)"
          elif [ -n "$FIREBASE_MANNYDOORS" ] && [ "${FIREBASE_MANNYDOORS#\{}" = "$FIREBASE_MANNYDOORS" ]; then
            echo "method=token" >> "$GITHUB_OUTPUT"
            echo "Firebase auth: CI token (FIREBASEMANNYDOORS)"
          elif [ -n "$FIREBASE_TOKEN_LEGACY" ]; then
            echo "method=token" >> "$GITHUB_OUTPUT"
            echo "Firebase auth: CI token (FIREBASE_TOKEN)"
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
            echo "::warning title=Firebase deploy skipped::Add FIREBASEMANNYDOORS (firebase login:ci token) or a service-account JSON."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.method != 'none'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.method != 'none'
        with:
          node-version: '20'

      - id: auth
        if: steps.creds.outputs.method == 'sa'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASEMANNYDOORS }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.creds.outputs.method == 'sa'

      - name: Install Firebase CLI
        if: steps.creds.outputs.method != 'none'
        run: npm install -g firebase-tools@14.11.0

      - name: Install root deps and build knowledge
        if: steps.creds.outputs.method != 'none'
        run: |
          npm ci
          node scripts/build-pm-knowledge.mjs

      - name: Install functions deps
        if: steps.creds.outputs.method != 'none'
        working-directory: functions
        run: npm ci

      - name: Verify functions entry loads
        if: steps.creds.outputs.method != 'none'
        working-directory: functions
        env:
          GEMINI_API_KEY: ci-smoke-test
        run: node -e "import('./index.js').then(() => console.log('functions index ok'))"

      - name: Deploy functions and Firestore rules (service account)
        if: steps.creds.outputs.method == 'sa'
        run: firebase deploy --only functions,firestore:rules --project property-managment-a5ed3 --non-interactive

      - name: Deploy functions and Firestore rules (CI token)
        if: steps.creds.outputs.method == 'token'
        env:
          FIREBASE_MANNYDOORS: ${{ secrets.FIREBASEMANNYDOORS }}
          FIREBASE_TOKEN_LEGACY: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_MANNYDOORS" ] && [ "${FIREBASE_MANNYDOORS#\{}" = "$FIREBASE_MANNYDOORS" ]; then
            export FIREBASE_TOKEN="$FIREBASE_MANNYDOORS"
          else
            export FIREBASE_TOKEN="$FIREBASE_TOKEN_LEGACY"
          fi
          firebase deploy --only functions,firestore:rules --project property-managment-a5ed3 --non-interactive
