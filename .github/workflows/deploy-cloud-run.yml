name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for GCP deploy credentials
        id: creds
        run: |
          if [ -z "${{ secrets.PROJECTMANAGEMENT }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Cloud Run deploy blocked::Add PROJECTMANAGEMENT (GCP service-account JSON with Cloud Build, Storage, and Cloud Run permissions)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'

      - id: auth
        if: steps.creds.outputs.present == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PROJECTMANAGEMENT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.creds.outputs.present == 'true'

      - name: Build and deploy (cloudbuild.yaml)
        if: steps.creds.outputs.present == 'true'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || steps.auth.outputs.project_id }}
        run: |
          gcloud builds submit --config cloudbuild.yaml --project "${PROJECT_ID}" --substitutions SHORT_SHA=$(git rev-parse --short HEAD)

      - name: Verify live site updated
        if: steps.creds.outputs.present == 'true'
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            sleep 20
            if ! curl -fsI "https://www.manydoorsai.com/manydoors-ai-property-managment-automation.mp4" | grep -q "200"; then
              echo "Pitch video not yet 200 (attempt $i/6)"
              continue
            fi
            html="$(curl -fsSL https://www.manydoorsai.com/)"
            if echo "$html" | grep -q "Multifamily community"; then
              echo "Live bundle still contains old pitch image alt text (attempt $i/6)"
              continue
            fi
            echo "Deploy verified: pitch video and bundle look current."
            exit 0
          done
          echo "::warning title=Post-deploy check inconclusive::Cloud Run may still be rolling out. Run ./scripts/verify-live-deploy.sh"

      - name: Fail when no GCP credentials
        if: steps.creds.outputs.present != 'true'
        run: exit 1
